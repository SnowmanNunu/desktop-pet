name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows portable
        run: npm run dist:win
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build macOS dmg
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Linux AppImage
        run: npm run dist:linux
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*.AppImage

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: 哈士奇桌面宠物 ${{ github.ref_name }}
          body: |
            ## 🎉 哈士奇桌面宠物 ${{ github.ref_name }}

            一只会定时提醒、有表情动作的桌面二哈。

            ---

            ### 📥 下载地址

            #### Windows
            - **便携版（推荐）**：`.exe` — 双击即可运行，无需安装

            #### macOS
            - **DMG 安装包**：打开后将应用拖入 Applications

            #### Linux
            - **AppImage**：`chmod +x *.AppImage` 后双击运行

            ---

            ### 📝 说明

            - 宠物窗口为透明小窗口，不影响桌面操作
            - 按住宠物可拖到屏幕任意位置
            - 任务栏托盘图标 + `Ctrl+Shift+S` 快捷键可随时呼出控制面板
            - 定时提醒在应用运行时后台触发（宠物动画 + 气泡 + 系统通知）
          files: |
            artifacts/windows/*
            artifacts/macos/*
            artifacts/linux/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌面哈士奇</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      cursor: grab;
      user-select: none;
      -webkit-app-region: no-drag;
    }
    body.dragging {
      cursor: grabbing;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="petCanvas" tabindex="0"></canvas>
  <script src="pet.js"></script>
</body>
</html>

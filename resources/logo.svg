<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 背景渐变：深蓝到紫色 -->
    <radialGradient id="bgGrad" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#3a5f8f"/>
      <stop offset="60%" stop-color="#2a3f62"/>
      <stop offset="100%" stop-color="#1a2340"/>
    </radialGradient>

    <!-- 耳朵渐变 -->
    <linearGradient id="earGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a7395"/>
      <stop offset="100%" stop-color="#3a5270"/>
    </linearGradient>

    <!-- 眼睛渐变 -->
    <radialGradient id="eyeGrad" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#7ed0ff"/>
      <stop offset="60%" stop-color="#3ba3f5"/>
      <stop offset="100%" stop-color="#1a7bc8"/>
    </radialGradient>

    <!-- 柔和发光 -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bgGrad)"/>

  <!-- 装饰圆环 -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="64" cy="64" r="38" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>

  <!-- 哈士奇头部 -->
  <g transform="translate(64, 68)" filter="url(#softGlow)">
    <!-- 耳朵 -->
    <path d="M-34 -28 L-44 -62 L-16 -44 Z" fill="url(#earGrad)" stroke="#2a3f52" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M34 -28 L44 -62 L16 -44 Z" fill="url(#earGrad)" stroke="#2a3f52" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- 耳内粉 -->
    <path d="M-34 -30 L-40 -52 L-22 -40 Z" fill="#f0c8d4" opacity="0.8"/>
    <path d="M34 -30 L40 -52 L22 -40 Z" fill="#f0c8d4" opacity="0.8"/>

    <!-- 头轮廓 -->
    <ellipse cx="0" cy="0" rx="44" ry="40" fill="#4a5d7a" stroke="#2a3f52" stroke-width="1.5"/>

    <!-- 面部白色面具 -->
    <path d="M-30 -18 Q-18 -42 0 -40 Q18 -42 30 -18 Q26 -2 18 10 Q10 22 0 24 Q-10 22 -18 10 Q-26 -2 -30 -18 Z" fill="#f5f8fb"/>

    <!-- 眼睛上方深色区域 -->
    <path d="M-28 -20 Q-16 -26 -6 -18 Q-14 -12 -26 -10 Z" fill="#4a5d7a" opacity="0.3"/>
    <path d="M28 -20 Q16 -26 6 -18 Q14 -12 26 -10 Z" fill="#4a5d7a" opacity="0.3"/>

    <!-- 眼睛 -->
    <ellipse cx="-16" cy="-8" rx="9" ry="10" fill="#ffffff" stroke="#2a3f52" stroke-width="1"/>
    <ellipse cx="-16" cy="-8" rx="5.5" ry="6" fill="url(#eyeGrad)"/>
    <ellipse cx="-16" cy="-7" rx="2.8" ry="3.2" fill="#0f1720"/>
    <circle cx="-13.5" cy="-11" r="2" fill="#ffffff" opacity="0.9"/>

    <ellipse cx="16" cy="-8" rx="9" ry="10" fill="#ffffff" stroke="#2a3f52" stroke-width="1"/>
    <ellipse cx="16" cy="-8" rx="5.5" ry="6" fill="url(#eyeGrad)"/>
    <ellipse cx="16" cy="-7" rx="2.8" ry="3.2" fill="#0f1720"/>
    <circle cx="18.5" cy="-11" r="2" fill="#ffffff" opacity="0.9"/>

    <!-- 鼻子 -->
    <ellipse cx="0" cy="8" rx="7" ry="5" fill="#1a1a1a"/>
    <ellipse cx="-2" cy="6" rx="2" ry="1.2" fill="#ffffff" opacity="0.3"/>

    <!-- 嘴巴 -->
    <path d="M0 13 L0 18" stroke="#2a3f52" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-10 20 Q0 26 10 20" fill="none" stroke="#2a3f52" stroke-width="1.8" stroke-linecap="round"/>

    <!-- 腮红 -->
    <ellipse cx="-28" cy="6" rx="5" ry="3" fill="#ff8fa3" opacity="0.25"/>
    <ellipse cx="28" cy="6" rx="5" ry="3" fill="#ff8fa3" opacity="0.25"/>
  </g>
</svg>
